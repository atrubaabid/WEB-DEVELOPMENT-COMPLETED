<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    }

    body {
        width: 100%;
        height: 100vh;
        display: grid;
        place-items: center;
        background-color: black;
        color: yellow;
    }

    .promise {
        padding: 2rem;
        border-radius: 20px;
        border: 2px solid yellow;
        box-shadow: 0px 0px 20px 0px yellow;
        text-align: center;

        & h1,
        p {
            margin-bottom: 2.5rem;
        }

        & button {
            padding: 0.5rem 2rem;
            border: none;
            background-color: yellow;
            color: black;
            font-weight: 500;
            font-size: 15px;
            border-radius: 20px;
        }


    }
</style>

<body>
    <div class="promise">
        <h1>Welcome to Dad Jokes!</h1>
        <p class="joke"></p>
        <button>Get Another Joke</button>
    </div>

    <script>
        let showjoke = document.querySelector(".joke");
        let btn = document.querySelector("button");
        let APIurl = "https://icanhazdadjoke.com/";

        // async function fetchData() {
        let fetchData = async () => {
            try {
                // fetch also return a promise
                let res = await fetch(APIurl, {
                    headers: {
                        Accept: "application/json"
                    },
                })

                let data = await res.json();
                showjoke.innerHTML = data.joke;
            } catch (error) {
                console.log(error);
                showjoke.innerHTML = "API is not working";
            }
        }

        fetchData();

        btn.addEventListener("click", fetchData)
    </script>
</body>

</html>
