<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        letter-spacing: 1px;
    }

    body {
        width: 100%;
        height: 100vh;
        background-color: black;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .events {
        text-align: center;

        & .ques {
            font-size: 1.5rem;
        }

        & ul {
            margin-top: 2rem;
            margin-bottom: 2rem;
            list-style: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;

            & li {
                width: 15rem;
                border: 1px solid white;
                padding: 0.5rem;
                border-radius: 5px;
                transition: transform 0.3s ease-in-out;

            }

            & li:hover {
                transform: scale(1.1);
                /* transform:; */
            }
        }


        & .showFavOne {
            color: yellow;
            letter-spacing: 1.5px;
            font-size: 25px;

        }
    }
</style>

<body>

    <div class="events">
        <p class="ques">Which one you like the most in MERN Stack Development?</p>

        <ul id="myList">
            <li>🌐 HTML5 🌐</li>
            <li>🎨 CSS3 🎨</li>
            <li>🔀 Git & GitHub 🔀</li>
            <li>🅱️ Bootstrap 🅱️</li>
            <li>💨 Tailwind CSS 💨</li>
            <li>⚡ JavaScript ⚡</li>
            <li>🔥 Firebase / Supabase 🔥</li>
            <li>⚛️ React.js ⚛️</li>
            <li>🚀 Express.js 🚀</li>
            <li>🟢 Node.js 🟢</li>
            <li>🎯 Next.js 🎯</li>
            <li>🍃 MongoDB 🍃</li>
        </ul>

        <p class="showFavOne"></p>


    </div>


    <script>

        let myList = document.querySelector("#myList");
        let showFavOne = document.querySelector(".showFavOne");

        myList.addEventListener("click", (e) => {
            // console.log(e.target.innerHTML);

            e.target.style.transform = " rotateY(360deg)"

            setTimeout(() => {
                e.target.style.transform = " rotateY(0deg)"

            }, 500)

            showFavOne.innerHTML = `I am like the most in MERN Stack Develoment is: ${e.target.innerHTML}`


        })

    </script>
</body>

</html>
