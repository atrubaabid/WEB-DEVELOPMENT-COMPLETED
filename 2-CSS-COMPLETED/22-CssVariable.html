<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  /* CSS VARIABLES */


  /* to create variable */
  :root {
    --bg: aqua;
    --color: orange;
    --radius: 20px;
    --shadow: 2px 2px 10px 0 black;
    --padding: 1rem;
  }

  /* to use variable */
  .box {
    width: 200px;
    height: 200px;
    display: grid;
    place-items: center;

    background-color: var(--bg);
    color: var(--color);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: var(--padding);
  }
</style>

<body>


  <!-- CSS VARIABLE -->

  <div class="box">
    Atruba
  </div>

</body>

</html>
