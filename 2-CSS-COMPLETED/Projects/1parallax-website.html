<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: sans-serif;
    }

    section {
        width: 100%;
        height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;

        background-image: linear-gradient(rgba(0, 0, 0, 0.3),
                rgba(0, 0, 0, 0.3)),
            url(images/img\ \(1\).jpg);
        background-repeat: no-repeat;
        background-size: 100% 100%;
        background-attachment: fixed;

    }

    .section-2 {
        background-image: linear-gradient(rgba(0, 0, 0, 0.3),
                rgba(0, 0, 0, 0.3)),
            url(images/img\ \(2\).jpg);

    }

    .section-3 {
        background-image: linear-gradient(rgba(0, 0, 0, 0.3),
                rgba(0, 0, 0, 0.3)),
            url(images/img\ \(3\).jpg);
    }

    .section-4 {
        background-image: linear-gradient(rgba(0, 0, 0, 0.3),
                rgba(0, 0, 0, 0.3)),
            url(images/img\ \(4\).jpg);
    }







    h2 {
        font-size: 64px;
        font-weight: bold;
        text-transform: uppercase;
        color: white;
        text-shadow: 2px 2px 5px black;
    }

    p {
        font-size: 20px;
        color: white;
    }
</style>

<body>
    <section>
        <div>
            <h2>Paralax 1</h2>
            <p>The Best CSS Course Ever</p>
        </div>
    </section>

    <section class="section-2">
        <div>
            <h2>Paralax 2</h2>
            <p>The Best CSS Course Ever</p>
        </div>
    </section>

    <section class="section-3">
        <div>
            <h2>Paralax 3</h2>
            <p>The Best CSS Course Ever</p>
        </div>
    </section>

    <section class="section-4">
        <div>
            <h2>Paralax 4</h2>
            <p>The Best CSS Course Ever</p>
        </div>
    </section>


</body>

</html>
