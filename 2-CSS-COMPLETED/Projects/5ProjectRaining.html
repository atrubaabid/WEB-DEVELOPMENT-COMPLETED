<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background-image: url(images/house.avif);
            background-size: 100% 100%;
        }

        .rain {
            width: 100%;
            height: 100vh;
            background-image: url(images/rain2.png);
            animation: raining 1s linear infinite;

        }

        @keyframes raining {

            0% {
                background-position: 0% 0%;

            }

            100% {
                background-position: 20% 200%;

            }

        }
    </style>
</head>

<body>

    <div class="rain"></div>



</body>

</html>
