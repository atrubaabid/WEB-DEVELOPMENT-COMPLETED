<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background-color: purple;
            display: grid;
            place-items: center;
        }

        button {
            width: 150px;
            padding: 10px;
            border: 3.5px solid pink;
            background-color: transparent;
            color: pink;
            font-weight: bold;

        }

        button:hover {

            animation: shake 0.2s linear infinite;
        }

        @keyframes shake {
            0% {
                rotate: 20deg;
            }

            25% {
                rotate: 0deg;
            }

            50% {
                rotate: -20deg;
            }

            75% {
                rotate: 0deg;
            }

            100% {
                rotate: 20deg;
            }

        }
    </style>


</head>

<body>

    <button>Shake Me</button>

</body>

</html>
