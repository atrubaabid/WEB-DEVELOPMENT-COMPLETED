<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background-color: antiquewhite;
            display: grid;
            place-items: center;
        }

        .top-border {
            width: 70%;
            height: 70vh;
            /* background-color: aqua; */
            border-top: 2rem solid purple;
            border-radius: 15px;

            display: flex;
            justify-content: center;
            gap: 2.6rem;
        }


        .lines {
            background-color: purple;
            height: 40vh;
            width: 1.5%;
            transform-origin: top;
            position: relative;
            top: -7px;


        }

        .lines::before {
            content: "";
            background-color: purple;
            width: 50px;
            height: 50px;
            position: absolute;
            border-radius: 50%;
            bottom: -10px;
            left: -20px;
        }

        .lines:first-child {
            animation: moves 1s linear infinite;

        }

        .lines:last-child {
            animation: moves2 1s linear 0.5s infinite;

        }

        @keyframes moves {

            0% {
                rotate: 0deg;
            }

            25% {
                rotate: 30deg;
            }

            50% {
                rotate: 0deg;
            }

            100% {
                rotate: 0deg;

            }

        }

        @keyframes moves2 {

          
            0% {
                rotate: 0deg;
            }

            25% {
                rotate: -30deg;
            }

            50% {
                rotate: 0deg;
            }

            100% {
                rotate: 0deg;

            }

        }
    </style>


</head>

<body>

    <div class="top-border">
        <div class="lines"></div>
        <div class="lines"></div>
        <div class="lines"></div>
        <div class="lines"></div>
        <div class="lines"></div>
    </div>

</body>

</html>
