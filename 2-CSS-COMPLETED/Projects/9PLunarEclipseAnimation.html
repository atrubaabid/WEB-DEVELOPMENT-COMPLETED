<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background-color: antiquewhite;
            display: grid;
            place-items: center;
        }

        .universe {
            width: 40vw;
            aspect-ratio: 1;
            background-color: orange;
            border-radius: 10px;
            display: grid;
            place-items: center;
            position: relative;
            animation: colormode 2s linear infinite;


        }

        .sun {
            width: 18vw;
            aspect-ratio: 1;
            background-color: red;
            border-radius: 50%;
            position: relative;
            overflow: hidden;


            &::before {
                content: "";
                width: inherit;
                aspect-ratio: 1;
                background-color: black;
                position: absolute;
                top: 0;
                left: 0;
                border-radius: inherit;
                animation: moonanimate 2s ease-in-out infinite;




            }

        }

        @keyframes moonanimate {

            0% {
                translate: 100px;
                scale: 1;
            }

            50% {
                translate: 0px;
                scale: 0.95;

            }


            100% {
                translate: -100px;
                scale: 1;

            }

        }

        @keyframes colormode {

            0% {
                background-color: orange;
            }



            50% {
                background-color: black;


            }

            100% {
                background-color: orange;


            }

        }
    </style>

</head>

<body>

    <div class="universe">
        <div class="sun"></div>
    </div>

</body>

</html>
