<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  /* CSS CLIP PATH MAKER  */

  /* https://bennettfeely.com/clippy/  */

  .ccp {
    width: 50%;

    clip-path: polygon(20% 0%,
        0% 20%,
        30% 50%,
        0% 80%,
        20% 100%,
        50% 70%,
        80% 100%,
        100% 80%,
        70% 50%,
        100% 20%,
        80% 0%,
        50% 30%);
  }
</style>

<body>

  <!-- CSS CLIP PATH MAKER -->

  <!-- https://bennettfeely.com/clippy/ -->

  <img src="images/img (1).jpg" alt="" class="ccp">

</body>

</html>
