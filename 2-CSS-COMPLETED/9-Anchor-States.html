<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  /* ANCHOR STATES */

  /* Jo link abhi tak click nahi hua. */
  .a:link {
    color: rgb(0, 179, 255);
  }

  /* Jo link pehle click ho chuka ho. */
  .a:visited {
    color: green;
  }

  /* Jab mouse link ke upar aaye. */
  .a:hover {
    color: yellow;
  }

  /* Jab user link ko click kar raha ho (mouse button press ki hui ho). */
  .a:active {
    color: red;
  }
</style>

<body>

  <!-- ANCHOR STATES -->

  <a href="#" class="a">Home</a>

</body>

</html>
