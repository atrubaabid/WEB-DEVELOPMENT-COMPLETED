  <!-- display:   =>     grid Parent ko grid banao
  grid-template-columns   =>     Columns banao
  grid-template-rows    =>     Rows banao
  gap   =>     Space between rows & columns
  row-gap   =>     Sirf rows ka gap
  column-gap    =>     Sirf columns ka gap

  justify-items   =>     Har item ko left/right move karo
  align-items   =>     Har item ko up/down move karo
  place-items   =>     justify-items + align-items

  justify-content   =>     Puri grid ko left/right move karo
  align-content   =>     Puri grid ko up/down move karo
  place-content   =>    justify-content + align-content

  grid-column   =>     Item kitni columns cover kare
  grid-row    =>     Item kitni rows cover kare
  grid-area   =>     Row + Column position ek sath
  grid-template-areas   =>     Layout ko names do

  grid-auto-rows    =>     Extra rows ki size
  grid-auto-columns   =>     Extra columns ki size

  grid-auto-flow    =>     Extra items ka flow

  justify-self    =>     Sirf ek item left/right
  align-self    =>     Sirf ek item up/down
  place-self    =>     justify-self + align-self -->
