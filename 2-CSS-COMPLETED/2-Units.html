<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /* UNITS IN CSS */

    /* absolute lengths */
    /* px, in, pt */

    /* relative lengths */
    /* em, rem, %  */

    html {
        font-size: 25px
    }

    .parent {
        font-size: 20px
    }

    .child {
        background-color: aqua;

        /* font-size: 50px */
        /* font-size: 50%;   */
        /* font-size: 2em; */
        /* font-size: 2rem; */
        width: 20vw;
        height: 20vh;
        margin: auto;
    }
</style>

<body>
    <!-- UNITS IN CSS -->


    <!-- px  =>   Fixed size
         %   =>   Parent ke hisaab se
         em  =>   Parent font-size ke hisaab se
         rem =>   Root (html) font-size ke hisaab se
         vw  =>   Screen width ka %
         vh  =>   Screen height ka %
         auto =>   Browser khud decide kare -->


    <div class="parent">
        <div class="child">Atruba</div>
    </div>


</body>

</html>
