<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <!-- 1. Title Tag ⭐⭐⭐⭐⭐  =>  ye Google search me title ke tor par dikh sakta hai. -->
    <title>Learn HTML & CSS Free</title>

    <!-- 2. Meta Description ⭐⭐⭐⭐  =>  Ye Google search result me description ke tor par dikh sakti hai. -->
    <meta name="description"
        content="Learn HTML, CSS and JavaScript with easy examples. tell everything about your website">


    <!-- 3. Meta keyword ⭐⭐⭐⭐  => Meri website in topics ke baare me hai but now google not use this -->
    <meta name="keywords" content="css, cssfullcourse, completecss, mern" />


    <!-- 4. Robots Meta Tag ⭐⭐  =>  Page ko Google me dikhana hai, Is page ke links bhi follow karne hain. -->
    <meta name="robots" content="index,follow" />


    <!-- index → Page ko Google me show karo
         noindex → Page ko Google me show mat karo
         follow → Links ko follow karo jo is page me hyn
         nofollow → Links ko follow mat karo -->




</head>


<body>

</body>

</html>
